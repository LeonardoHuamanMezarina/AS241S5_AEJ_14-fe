<div class="flex h-screen bg-slate-100 text-slate-700 font-sans overflow-hidden">
  <!-- Sidebar -->
  <aside 
    class="w-64 bg-white/70 backdrop-blur-md border-r border-slate-200/60 flex flex-col justify-between transition-all duration-300"
    [class.w-20]="isCollapsed()"
  >
    <div>
      <!-- Sidebar Header / Logo -->
      <div class="h-16 flex items-center px-4 border-b border-slate-200/60">
        <div class="flex items-center space-x-3 overflow-hidden">
          <div class="p-2 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-lg shadow-lg flex-shrink-0">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          @if (!isCollapsed()) {
            <span class="text-lg font-extrabold tracking-wider bg-gradient-to-r from-slate-800 to-indigo-900 bg-clip-text text-transparent truncate select-none">Vaplex AI</span>
          }
        </div>
      </div>

      <!-- Sidebar Navigation Menu -->
      <nav class="p-4 space-y-2">
        <a routerLink="/dashboard" routerLinkActive="bg-indigo-600 text-white shadow-md shadow-indigo-500/20 hover:text-white" [routerLinkActiveOptions]="{exact: true}" 
          class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-200/50 hover:text-slate-900 transition duration-150 select-none cursor-pointer text-slate-600">
          <svg class="w-5 h-5 flex-shrink-0" [class.text-indigo-600]="!isCollapsed()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          @if (!isCollapsed()) {
            <span class="text-sm font-semibold tracking-wide">Inicio</span>
          }
        </a>

        <a routerLink="/youtube" routerLinkActive="bg-indigo-600 text-white shadow-md shadow-indigo-500/20 hover:text-white"
          class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-200/50 hover:text-slate-900 transition duration-150 select-none cursor-pointer text-slate-600">
          <svg class="w-5 h-5 flex-shrink-0" [class.text-red-500]="!isCollapsed()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          @if (!isCollapsed()) {
            <span class="text-sm font-semibold tracking-wide">YouTube Summarizer</span>
          }
        </a>

        <a routerLink="/claude" routerLinkActive="bg-indigo-600 text-white shadow-md shadow-indigo-500/20 hover:text-white"
          class="flex items-center space-x-3 px-3 py-2.5 rounded-xl hover:bg-slate-200/50 hover:text-slate-900 transition duration-150 select-none cursor-pointer text-slate-600">
          <svg class="w-5 h-5 flex-shrink-0" [class.text-amber-600]="!isCollapsed()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
          </svg>
          @if (!isCollapsed()) {
            <span class="text-sm font-semibold tracking-wide">Claude AI Queries</span>
          }
        </a>
      </nav>
    </div>

    <!-- Sidebar Collapse Toggle Button -->
    <div class="p-4 border-t border-slate-200/60">
      <button (click)="toggleCollapse()" class="flex items-center space-x-3 px-3 py-2 w-full rounded-xl hover:bg-slate-200/50 transition duration-150 text-slate-500 hover:text-slate-900 select-none cursor-pointer">
        <svg class="w-5 h-5 transition-transform duration-300" [class.rotate-180]="isCollapsed()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        </svg>
        @if (!isCollapsed()) {
          <span class="text-sm font-medium">Contraer</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Top Navbar -->
    <header class="h-16 flex items-center justify-between px-6 bg-white/60 backdrop-blur-md border-b border-slate-200/60 flex-shrink-0">
      <div class="flex items-center space-x-3">
        <span class="text-xs uppercase font-bold tracking-wider text-slate-400">Módulo de APIs WebFlux</span>
      </div>

      <div class="flex items-center space-x-4">
        <div class="text-right">
          <p class="text-sm font-bold text-slate-800">Usuario Administrador</p>
          <p class="text-xs text-indigo-600 font-semibold">Panel de Control</p>
        </div>
        <div class="w-10 h-10 bg-indigo-50 border border-indigo-200/60 text-indigo-600 flex items-center justify-center rounded-xl font-bold select-none cursor-default">
          A
        </div>
      </div>
    </header>

    <!-- Main Dynamic Routing Content -->
    <main class="flex-1 overflow-y-auto p-6 bg-slate-50/60 select-text">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
